<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Happy Times Dayhome</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/icon.png">
  <link rel="stylesheet" href="/assets/css/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>

<div class="site">
  {{NAV}}

  <section class="error-section fade-in-section" style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 3rem 1rem;">
    <div style="max-width: 400px;">
      <p class="error-code" style="font-size: 6rem; font-weight: 700; color: var(--color-accent); line-height: 1; margin: 0 0 1rem;">404</p>
      <h1 class="error-title" style="font-size: 1.75rem; margin: 0 0 0.75rem; color: var(--color-text);">Page not found</h1>
      <p class="error-message" style="color: var(--color-text-muted); margin: 0 0 2rem;">Sorry, we couldn't find the page you're looking for. It might have been moved or doesn't exist.</p>
      <a class="btn-primary" href="/" style="display: inline-flex; align-items: center; gap: 0.5rem;">Back to Home <i class="ti ti-arrow-right" aria-hidden="true"></i></a>
    </div>
  </section>

  {{FOOTER}}
</div>

{{PRIVACY_MODAL}}

<script src="/assets/js/animations.js"></script>
<script src="/assets/js/main.js"></script>
</body>
</html>
